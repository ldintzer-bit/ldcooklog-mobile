<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="LDCookLog">
<meta name="theme-color" content="#161616">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>LDCookLog Mobile</title>
<style>
:root{
  --bg:#111;--panel:#1b1b1b;--panel2:#242424;--line:#333;--text:#f4f4f4;
  --muted:#aaa;--accent:#f2a13a;--good:#79c267;--warn:#f1c453;--danger:#e66a5e;--blue:#6aa7e8;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif}
body{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.app{max-width:860px;margin:0 auto;padding:14px}
header{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:8px 2px 14px}
h1{margin:0;font-size:25px;line-height:1.05}.sub{color:var(--muted);font-size:13px;margin-top:5px}
.badge{border:1px solid var(--line);background:#171717;border-radius:999px;padding:7px 10px;color:var(--muted);font-size:12px;white-space:nowrap}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.card h2{font-size:15px;margin:0 0 12px;color:#ddd}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.metric{background:var(--panel2);border-radius:13px;padding:12px;border:1px solid #303030}
.metric .label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.metric .value{font-size:25px;font-weight:700;margin-top:3px}.metric .small{font-size:12px;color:var(--muted);margin-top:2px}
.controls{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
button{-webkit-appearance:none;border:0;border-radius:15px;padding:16px 12px;font-size:16px;font-weight:700;color:#111;background:var(--accent);min-height:58px;touch-action:manipulation}
button.secondary{background:#303030;color:#fff;border:1px solid #444}
button.good{background:var(--good)}button.warn{background:var(--warn)}button.danger{background:var(--danger)}button.blue{background:var(--blue)}
button:active{transform:scale(.985)}
.formrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label{font-size:12px;color:var(--muted);display:block;margin-bottom:5px}
input,select,textarea{width:100%;background:#111;border:1px solid #444;border-radius:12px;color:#fff;padding:12px;font-size:16px}
textarea{resize:vertical;min-height:78px}
.event-list{display:flex;flex-direction:column;gap:8px}
.event{background:#161616;border:1px solid #303030;border-radius:12px;padding:10px 12px;display:grid;grid-template-columns:80px 1fr;gap:10px}
.event time{color:var(--accent);font-variant-numeric:tabular-nums;font-size:13px}
.event strong{display:block;font-size:14px}.event span{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap}.toolbar button{min-height:42px;padding:10px 12px;font-size:13px;flex:1}
.footer-note{color:#777;font-size:11px;text-align:center;padding:8px 0 18px}
@media(max-width:520px){.grid3{grid-template-columns:1fr}.grid2,.formrow{grid-template-columns:1fr 1fr}button{font-size:15px}.metric .value{font-size:22px}}
</style>
</head>
<body>
<div class="app">
<header>
  <div><h1>LDCookLog Mobile</h1><div class="sub">V1.1 BBQ Control Panel</div></div>
  <div class="badge" id="saveBadge">Saved on this device</div>
</header>

<section class="card">
<h2>Current Cook</h2>
<div class="formrow">
<div><label for="smoker">Smoker</label><select id="smoker"><option>Traeger Ironwood 885</option><option>Weber 22" Kettle</option><option>Other</option></select></div>
<div><label for="cookName">Cook</label><input id="cookName" value="Pork Butt" placeholder="Brisket, ribs, pork butt…"></div>
</div>
<div class="formrow" style="margin-top:10px">
<div><label for="weight">Weight (lb)</label><input id="weight" type="number" step="0.1" inputmode="decimal" placeholder="7.5"></div>
<div><label for="target">Target Pit °F</label><input id="target" type="number" inputmode="numeric" value="225"></div>
</div>
</section>

<section class="card">
<h2>Cook Status</h2>
<div class="grid3">
<div class="metric"><div class="label">Elapsed</div><div class="value" id="elapsed">00:00</div><div class="small" id="startText">Not started</div></div>
<div class="metric"><div class="label">Target</div><div class="value"><span id="targetDisplay">225</span>°</div><div class="small">Pit setpoint</div></div>
<div class="metric"><div class="label">Events</div><div class="value" id="eventCount">0</div><div class="small">logged</div></div>
</div>
</section>

<section class="card">
<h2>Quick Events</h2>
<div class="controls">
<button class="good" data-event="Meat On">Meat On</button>
<button class="blue" data-event="Target Change">Change Target</button>
<button class="warn" data-event="Spritz">Spritz</button>
<button class="warn" data-event="Wrap">Wrap</button>
<button class="secondary" data-event="Lid Open">Lid Open</button>
<button class="secondary" data-event="Fuel / Pellets">Fuel / Pellets</button>
<button class="secondary" data-event="Probe Check">Probe Check</button>
<button class="danger" data-event="Meat Off">Meat Off</button>
</div>
<div style="margin-top:10px">
<label for="noteText">Quick note</label>
<textarea id="noteText" placeholder="e.g. bark looks good, raised target to 250, moved probe…"></textarea>
<button class="secondary" id="addNote" style="width:100%;margin-top:8px">Add Note</button>
</div>
</section>

<section class="card">
<h2>Event Log</h2>
<div class="event-list" id="eventList"></div>
<div class="toolbar" style="margin-top:12px">
<button class="secondary" id="exportCsv">Export CSV</button>
<button class="secondary" id="copyLog">Copy Log</button>
<button class="danger" id="resetCook">Reset Cook</button>
</div>
</section>

<div class="footer-note">V1.1 runs as a normal Safari web app. Data is stored locally on each device in this version.</div>
</div>

<script>
const $=id=>document.getElementById(id);
const stateKey="ldcooklog-mobile-v1-1";
let state={smoker:"Traeger Ironwood 885",cookName:"Pork Butt",weight:"",target:225,start:null,events:[]};

function load(){try{const raw=localStorage.getItem(stateKey);if(raw)state=Object.assign(state,JSON.parse(raw));}catch(e){}}
function save(){state.smoker=$("smoker").value;state.cookName=$("cookName").value;state.weight=$("weight").value;state.target=Number($("target").value)||0;localStorage.setItem(stateKey,JSON.stringify(state));$("saveBadge").textContent="Saved on this device";}
function fmtTime(d){return new Intl.DateTimeFormat([],{hour:"numeric",minute:"2-digit"}).format(d)}
function fmtDateTime(d){return new Intl.DateTimeFormat([],{year:"numeric",month:"2-digit",day:"2-digit",hour:"numeric",minute:"2-digit",second:"2-digit"}).format(d)}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function updateElapsed(){if(!state.start){$("elapsed").textContent="00:00";$("startText").textContent="Not started";return}const diff=Math.max(0,Date.now()-new Date(state.start).getTime());const mins=Math.floor(diff/60000);const h=Math.floor(mins/60),m=mins%60;$("elapsed").textContent=String(h).padStart(2,"0")+":"+String(m).padStart(2,"0");$("startText").textContent="Started "+fmtTime(new Date(state.start))}
function render(){$("smoker").value=state.smoker;$("cookName").value=state.cookName;$("weight").value=state.weight;$("target").value=state.target;$("targetDisplay").textContent=state.target||"—";$("eventCount").textContent=state.events.length;const list=$("eventList");list.innerHTML="";[...state.events].reverse().forEach(ev=>{const div=document.createElement("div");div.className="event";const t=new Date(ev.ts);div.innerHTML=`<time>${fmtTime(t)}</time><div><strong>${escapeHtml(ev.type)}</strong><span>${escapeHtml(ev.note||"")}</span></div>`;list.appendChild(div)});if(!state.events.length)list.innerHTML='<div style="color:#777;font-size:13px">No events yet.</div>';updateElapsed()}
function addEvent(type,note=""){const now=new Date();if(type==="Meat On"&&!state.start)state.start=now.toISOString();if(type==="Target Change"){const val=prompt("New target pit temperature °F:",String(state.target||""));if(val===null)return;const n=Number(val);if(!n)return;state.target=n;$("target").value=n;note=`Target changed to ${n}°F`;}state.events.push({ts:now.toISOString(),type,note,target:state.target});save();render()}
document.querySelectorAll("[data-event]").forEach(btn=>btn.addEventListener("click",()=>addEvent(btn.dataset.event)));
$("addNote").addEventListener("click",()=>{const txt=$("noteText").value.trim();if(!txt)return;addEvent("Note",txt);$("noteText").value=""});
["smoker","cookName","weight","target"].forEach(id=>$(id).addEventListener("change",()=>{save();render()}));
$("resetCook").addEventListener("click",()=>{if(!confirm("Reset current cook and erase this device's local event log?"))return;state={smoker:$("smoker").value,cookName:"",weight:"",target:225,start:null,events:[]};save();render()});
$("copyLog").addEventListener("click",async()=>{const lines=state.events.map(ev=>`${fmtDateTime(new Date(ev.ts))} — ${ev.type}${ev.note?": "+ev.note:""}`);const text=`${state.cookName||"Cook"} | ${state.smoker}\nTarget: ${state.target}°F\n\n`+lines.join("\n");try{await navigator.clipboard.writeText(text);alert("Cook log copied.")}catch(e){alert("Copy failed on this browser.")}});
$("exportCsv").addEventListener("click",()=>{const rows=[["timestamp","event","note","target_f"]];state.events.forEach(ev=>rows.push([ev.ts,ev.type,ev.note||"",ev.target??""]));const csv=rows.map(r=>r.map(v=>`"${String(v).replaceAll('"','""')}"`).join(",")).join("\n");const blob=new Blob([csv],{type:"text/csv"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=`LDCookLog-${new Date().toISOString().slice(0,10)}.csv`;a.click();URL.revokeObjectURL(a.href)});
load();render();setInterval(updateElapsed,15000);
</script>
</body>
</html>
