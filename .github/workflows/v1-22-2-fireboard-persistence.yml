name: V1.22.2 FireBoard Persistence

on:
  push:
    branches: [main]
    paths:
      - 'tools/patch-v1-22-2.py'
      - '.github/workflows/v1-22-2-fireboard-persistence.yml'

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply V1.22.2 patch
        run: python3 tools/patch-v1-22-2.py

      - name: Commit V1.22.2
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html service-worker.js
          git commit -m "V1.22.2 persist FireBoard association recognition"
          git push
