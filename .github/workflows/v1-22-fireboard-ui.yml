name: V1.22 FireBoard UI

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v1-22-fireboard-ui.yml'

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply V1.22 patch
        run: python .github/scripts/v1-22-patch.py

      - name: Commit V1.22.0
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html service-worker.js
          if git diff --cached --quiet; then
            echo "No V1.22 changes needed"
          else
            git commit -m "V1.22.0 FireBoard recent sessions UI"
            git push
          fi

      - name: Remove one-time deployment files
        run: |
          git pull --rebase
          git rm .github/workflows/v1-22-fireboard-ui.yml .github/scripts/v1-22-patch.py
          git commit -m "Remove V1.22 deployment files"
          git push
