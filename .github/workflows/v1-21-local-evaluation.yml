name: V1.21 local evaluation prototype

on:
  push:
    paths:
      - 'v1-21.js'
      - '.github/workflows/v1-21-local-evaluation.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject V1.21 prototype loader and bump service worker cache
        shell: python
        run: |
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text()
          marker = '<script src="v1-21.js"></script>'
          if marker not in s:
              s = s.replace('</body>', marker + '\n</body>')
              p.write_text(s)

          sw = Path('service-worker.js')
          t = sw.read_text()
          import re
          t = re.sub(r"const CACHE_NAME = ['\"][^'\"]+['\"]", "const CACHE_NAME = 'ldcooklog-v1-21-0'", t)
          if "'./v1-21.js'" not in t and '"./v1-21.js"' not in t:
              t = re.sub(r"(const APP_SHELL = \[)", r"\1\n  './v1-21.js',", t, count=1)
          sw.write_text(t)
      - name: Commit deployment files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html service-worker.js
          git commit -m "Load V1.21 local evaluation prototype" || exit 0
          git push
