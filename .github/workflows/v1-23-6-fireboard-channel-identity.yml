name: V1.30.9.8 Cook ID Event Recovery

on:
  push:
    branches: [main]
    paths:
      - 'tools/patch-v1-30-9-8-cookid-event-recovery.py'
      - '.github/workflows/v1-23-6-fireboard-channel-identity.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python3 tools/patch-v1-30-9-8-cookid-event-recovery.py
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html service-worker.js
          git diff --cached --quiet && exit 0
          git commit -m "V1.30.9.8 recover events across matching Cook ID rows"
          git push
