name: V1.23 FireBoard Cook Integration

on:
  push:
    branches: [main]
    paths:
      - 'tools/patch-v1-23.py'
      - '.github/workflows/v1-23-fireboard-integration.yml'

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply V1.23 integration patch
        run: python3 tools/patch-v1-23.py

      - name: Commit V1.23
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html service-worker.js
          git commit -m "V1.23.0 begin FireBoard cook integration"
          git push
