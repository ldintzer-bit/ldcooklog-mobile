name: V1.21.2 architecture cleanup

on:
  push:
    paths:
      - '.github/workflows/v1-21-cleanup.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Consolidate Cook Evaluation and remove prototype files
        shell: python
        run: |
          from pathlib import Path
          import re

          index = Path('index.html')
          feature = Path('v1-21.js')
          s = index.read_text()
          js = feature.read_text()
          marker = '<script src="v1-21.js"></script>'
          inline = '<script>\n' + js.rstrip() + '\n</script>'
          if marker not in s:
              raise SystemExit('V1.21 external script marker not found in index.html')
          s = s.replace(marker, inline, 1)
          index.write_text(s)

          sw = Path('service-worker.js')
          t = sw.read_text()
          t = re.sub(r"const CACHE_NAME = ['\"][^'\"]+['\"]", "const CACHE_NAME = 'ldcooklog-v1-21-2'", t)
          t = re.sub(r"\s*['\"]\./v1-21\.js['\"],?\n", "\n", t)
          sw.write_text(t)

          for name in [
              'v1-21.js',
              '.github/workflows/v1-21-local-evaluation.yml',
              '.github/workflows/v1-21-trigger.txt',
              '.github/workflows/v1-21-trigger2.txt',
              '.github/workflows/v1-21-trigger3.txt',
              '.github/workflows/v1-21-trigger4.txt',
          ]:
              Path(name).unlink(missing_ok=True)

          # Remove this one-time cleanup workflow too.
          Path('.github/workflows/v1-21-cleanup.yml').unlink(missing_ok=True)

      - name: Commit cleaned V1.21.2 architecture
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Consolidate V1.21.2 Cook Evaluation" || exit 0
          git push
