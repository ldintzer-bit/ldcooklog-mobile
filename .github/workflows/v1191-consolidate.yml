name: V1.19.1 one-time consolidation

on:
  push:
    paths:
      - '.github/workflows/v1191-consolidate.yml'

permissions:
  contents: write

jobs:
  consolidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Consolidate files
        run: |
          python3 - <<'PY'
          from pathlib import Path

          index_path = Path('index.html')
          feature_path = Path('v1-19.js')
          sw_path = Path('service-worker.js')
          workflow_path = Path('.github/workflows/v1191-consolidate.yml')

          html = index_path.read_text()
          js = feature_path.read_text()
          marker = '<!-- v1-19.js consolidated into index.html in V1.19.1 -->'

          if marker not in html:
              block = '\n' + marker + '\n<script>\n' + js.rstrip() + '''\n</script>
<script>
// V1.19.1 architecture cleanup metadata
(() => {
  const BUILD = "2026-09-13A";
  document.title = "LDCookLog Mobile V1.19.1";
  const headerSub = document.querySelector("header .sub");
  if (headerSub) headerSub.textContent = "V1.19.1 Stateful BBQ Control Panel";
  const footer = document.querySelector(".footer-note");
  if (footer) footer.innerHTML = "V1.19.1 architecture cleanup: Saved Cook Methods is consolidated into index.html; the temporary runtime feature file is retired.<br><strong>Build " + BUILD + "</strong>";
})();
</script>
'''
              if '</body>' not in html:
                  raise SystemExit('index.html has no closing body tag')
              index_path.write_text(html.replace('</body>', block + '</body>', 1))

          sw_path.write_text('''const CACHE_NAME = "ldcooklog-v1-19-1";
const APP_SHELL = [
  "./",
  "./index.html",
  "./manifest.webmanifest",
  "./icon-180.png",
  "./icon-512.png"
];

self.addEventListener("install", event => {
  event.waitUntil(caches.open(CACHE_NAME).then(cache => cache.addAll(APP_SHELL)));
  self.skipWaiting();
});

self.addEventListener("activate", event => {
  event.waitUntil(
    caches.keys().then(keys => Promise.all(keys.filter(key => key !== CACHE_NAME).map(key => caches.delete(key))))
  );
  self.clients.claim();
});

self.addEventListener("fetch", event => {
  if (event.request.method !== "GET") return;
  const url = new URL(event.request.url);
  if (url.origin !== self.location.origin) return;
  event.respondWith((async () => {
    try {
      const response = await fetch(event.request);
      if (response && response.ok) {
        const cache = await caches.open(CACHE_NAME);
        cache.put(event.request, response.clone());
      }
      return response;
    } catch (_) {
      const cached = await caches.match(event.request);
      if (cached) return cached;
      if (url.pathname.endsWith('/ldcooklog-mobile/') || url.pathname.endsWith('/ldcooklog-mobile/index.html')) {
        const fallback = await caches.match('./index.html');
        if (fallback) return fallback;
      }
      return Response.error();
    }
  })());
});
''')

          if feature_path.exists():
              feature_path.unlink()
          if workflow_path.exists():
              workflow_path.unlink()
          PY

      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Consolidate V1.19 Saved Cook Methods into index.html"
          git push
