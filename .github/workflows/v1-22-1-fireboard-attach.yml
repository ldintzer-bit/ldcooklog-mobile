name: V1.22.1 FireBoard Attach

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/v1-22-1-fireboard-attach.yml'
      - '.github/scripts/v1_22_1_fireboard_attach.py'

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply V1.22.1 patch
        run: python3 .github/scripts/v1_22_1_fireboard_attach.py

      - name: Commit app changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html service-worker.js
          git commit -m "V1.22.1 attach FireBoard sessions to cooks"
          git push

      - name: Remove one-time deployment files
        run: |
          git pull --rebase
          git rm .github/workflows/v1-22-1-fireboard-attach.yml .github/scripts/v1_22_1_fireboard_attach.py
          git commit -m "Remove V1.22.1 deployment files"
          git push
