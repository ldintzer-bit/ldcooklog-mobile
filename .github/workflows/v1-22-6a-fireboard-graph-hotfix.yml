name: V1.22.6a FireBoard Graph Hotfix

on:
  push:
    branches: [main]
    paths:
      - 'tools/patch-v1-22-6a.py'
      - '.github/workflows/v1-22-6a-fireboard-graph-hotfix.yml'

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply V1.22.6a hotfix
        run: python3 tools/patch-v1-22-6a.py

      - name: Commit V1.22.6a
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html service-worker.js
          git commit -m "V1.22.6a fix FireBoard graph cloud session helper"
          git push
