name: LDCookLog 2 development checks
on:
  push:
    branches: ['development/2.0-offline-recovery']
    paths: ['development/**', '.github/workflows/ldcooklog-2-development.yml']
  pull_request:
    paths: ['development/**', '.github/workflows/ldcooklog-2-development.yml']
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: node --test development/local-poc/tests/*.test.mjs development/native/tests/*.test.mjs
      - run: python3 -m unittest discover -s development/local-poc/migration -p 'test_*.py'
      - run: python3 development/native/bundle_web.py && git diff --exit-code development/native/Web/app.bundle.js
      - run: node tools/security-check.cjs
      - name: Browser UI regression with synthetic native bridge
        run: |
          npm install --prefix "$RUNNER_TEMP/ui-tools" playwright@1.62.1
          "$RUNNER_TEMP/ui-tools/node_modules/.bin/playwright" install --with-deps chromium
          NODE_PATH="$RUNNER_TEMP/ui-tools/node_modules" node development/native/tests/ui-smoke.cjs
  native:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Test real native file storage
        working-directory: development/native
        run: swift test
      - name: Generate development Xcode project
        working-directory: development/native
        run: brew install xcodegen && xcodegen generate
      - name: Compile iPhone app without signing or installation
        working-directory: development/native
        run: xcodebuild -project LDCookLogDevelopment.xcodeproj -scheme LDCookLogDevelopment -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
      - name: Compile native Mac administration companion
        working-directory: development/native
        run: xcodebuild -project LDCookLogDevelopment.xcodeproj -scheme LDCookLogMacDevelopment -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO build
      - name: Run actual WKWebView and native storage integration on iPhone simulator
        working-directory: development/native
        run: |
          device_id=$(xcrun simctl list devices available -j | python3 -c 'import sys,json; print(next(d["udid"] for devices in json.load(sys.stdin)["devices"].values() for d in devices if d["name"].startswith("iPhone")))')
          xcodebuild -project LDCookLogDevelopment.xcodeproj -scheme LDCookLogDevelopment -destination "platform=iOS Simulator,id=$device_id" -test-timeouts-enabled YES -default-test-execution-time-allowance 180 -maximum-test-execution-time-allowance 240 CODE_SIGNING_ALLOWED=NO test
